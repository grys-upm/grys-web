# =====================================================================
#  OBJETIVOS DE DESARROLLO SOSTENIBLE (página Grupo › ODS)
# ---------------------------------------------------------------------
#  · principal: true → «ODS principales» (declarados en el HUB de Innovación
#    UPM); el resto, «Otros ODS a los que contribuyen nuestros proyectos».
#  · color: color OFICIAL de Naciones Unidas (contenido de terceros, no es la
#    paleta del grupo). fg: color del número sobre ese fondo, elegido para que
#    el contraste sea ≥ 3:1 (texto grande, WCAG 2.2 AA).
#  · proyectos: slugs de _projects/ (se enlazan a su ficha).
#  · metas: metas de la Agenda 2030 (número y texto ES/EN).
#  Fuente: página «SDGs Alignment» de la web anterior + mockup v4.
#  PROPUESTA pendiente de validar por el grupo (ver PENDIENTES.md).
#  Validado con schemas/ods.schema.json.
# =====================================================================

- num: 9
  principal: true
  color: "#FD6925"
  fg: "#000000"
  title: { es: "Industria, innovación e infraestructura", en: "Industry, innovation and infrastructure" }
  desc:
    es: "Diseñamos y desplegamos infraestructuras digitales resilientes, seguras y adaptativas para redes y servicios de próxima generación, a escala industrial y de investigación: redes, middleware y plataformas abiertas, con transferencia de tecnología."
    en: "We design and deploy resilient, secure and adaptive digital infrastructures for next-generation networks and services, at both industrial and research scales: networks, middleware and open platforms, with technology transfer."
  metas:
    - { num: "9.1", es: "Desarrollar infraestructuras fiables y resilientes para el desarrollo sostenible.", en: "Develop reliable and resilient infrastructure for sustainable development." }
    - { num: "9.5", es: "Aumentar la investigación científica y mejorar la capacidad tecnológica de la industria.", en: "Enhance scientific research and upgrade the technological capabilities of industries." }
  proyectos: []

- num: 2
  principal: true
  color: "#DDA63A"
  fg: "#000000"
  title: { es: "Hambre cero", en: "Zero hunger" }
  desc:
    es: "Contribuimos a sistemas agrícolas sostenibles y resilientes con proyectos de agricultura de precisión y automatización de explotaciones, y con el OpenTech Lab."
    en: "We contribute to sustainable and resilient agricultural systems through precision agriculture and farm automation projects, and through the OpenTech Lab."
  metas:
    - { num: "2.4", es: "Asegurar sistemas de producción de alimentos sostenibles y aplicar prácticas agrícolas resilientes.", en: "Ensure sustainable food production systems and implement resilient agricultural practices." }
    - { num: "2.a", es: "Aumentar la inversión y la cooperación en investigación y desarrollo tecnológico agrícola.", en: "Increase investment and cooperation in agricultural research and technology development." }
  proyectos: [afarcloud, demeter]

- num: 11
  color: "#FD9D24"
  fg: "#000000"
  title: { es: "Ciudades y comunidades sostenibles", en: "Sustainable cities and communities" }
  desc:
    es: "Movilidad urbana, ciudades inteligentes y servicios urbanos basados en IoT para ecosistemas urbanos más eficientes, inclusivos y sostenibles."
    en: "Urban mobility, smart cities and IoT-based urban services for more efficient, inclusive and sustainable city ecosystems."
  metas:
    - { num: "11.2", es: "Acceso a sistemas de transporte seguros, asequibles, accesibles y sostenibles.", en: "Access to safe, affordable, accessible and sustainable transport systems." }
    - { num: "11.6", es: "Reducir el impacto ambiental de las ciudades, incluida la calidad del aire y la gestión de residuos.", en: "Reduce the environmental impact of cities, including air quality and waste management." }
