# =====================================================================
#  PORTADA · qué se destaca y cuántos elementos se muestran
# ---------------------------------------------------------------------
#  El resto de la portada sale solo de los datos: ejes y líneas, ámbitos,
#  noticias, eventos, convocatorias, publicaciones y cifras.
#  Validado con schemas/portada.schema.json.
# =====================================================================

# Proyectos destacados. Se eligen SOLOS al compilar (_plugins/destacados.rb):
#   1.º los proyectos en curso, del más reciente al más antiguo;
#   2.º después, el resto en orden cronológico inverso (los terminados más
#       recientemente primero).
# Decisión manual (opcional), con slugs = nombre del fichero en _projects/ sin .md:
#   fijos:   van siempre, los primeros y en este orden; el resto se rellena solo.
#   excluir: no se eligen nunca automáticamente.
destacados:
  numero: 3
  fijos: []
  excluir: []

# Número de elementos en cada bloque
noticias: 4
eventos: 3
publicaciones: 3

