- { from: /research/publications/grouped/, to: publications, lang: en }
# /research/projects/ y /research/publications/ no necesitan redirección:
# en la web nueva existen como /en/research/projects/ y /en/research/publications/,
# pero la URL antigua (sin /en/) sí se redirige:
- { from: /research/projects/, to: projects, lang: en }
- { from: /research/publications/, to: publications, lang: en }

