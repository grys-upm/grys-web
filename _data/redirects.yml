# =====================================================================
#  Redirecciones desde las URL de la web anterior (al-folio, solo inglés)
#  · from: ruta antigua (tal cual estaba publicada)
#  · to:   id de página de _data/routes.yml
#  · lang: idioma de destino (la web antigua estaba en inglés → en)
#  · anchor: (opcional) ancla dentro de la página destino
#  Las fichas antiguas de personas, proyectos y noticias se redirigen desde
#  el campo «old_urls» de cada elemento de la colección.
# =====================================================================

- { from: /about/, to: about, lang: en }
- { from: /team/, to: team, lang: en }
