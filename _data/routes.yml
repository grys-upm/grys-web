# =====================================================================
#  MAPA DEL SITIO · fuente única de menús, URL y títulos de las páginas
# ---------------------------------------------------------------------
#  · Las rutas «en» se escriben SIN el prefijo /en/ (lo añade polyglot).
#  · Cada página fija tiene dos ficheros: _pages/es/<id>.md y _pages/en/<id>.md
#    con el mismo «page_id» y el «permalink» de esta tabla.
#    scripts/comprobar_datos.py verifica que coinciden.
#  · Cambiar una URL aquí exige cambiar el permalink de los dos ficheros y
#    añadir una redirección en _data/redirects.yml.
# =====================================================================

menus:
  - id: group
    title: { es: Grupo, en: Group }
  - id: research
    title: { es: Investigación, en: Research }
  - id: lab
    title: { es: OpenTech Lab, en: OpenTech Lab }
  - id: collab
    title: { es: Colabora, en: Collaborate }
  - id: news
    title: { es: Actualidad, en: News }

# Orden = orden en los menús
pages:
  - id: home
    menu: null
    es: /
    en: /
    title: { es: Inicio, en: Home }

  # ---- Grupo ----
  - id: about
    menu: group
    es: /grupo/quienes-somos/
    en: /group/about/
    title: { es: Quiénes somos, en: About us }
    desc: { es: Misión, historia y valores, en: Mission, history and values }
  - id: team
    menu: group
    es: /grupo/equipo/
    en: /group/team/
    title: { es: Equipo, en: Team }
    desc: { es: Personas actuales y antiguas, en: Current and former members }
