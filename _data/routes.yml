    en: /privacy/
    title: { es: Privacidad, en: Privacy }

# ---------------------------------------------------------------------
#  Fichas de detalle generadas desde las colecciones (no salen en menús)
#  :slug  → campo «slug_es»/«slug_en», o «slug», o el nombre del fichero
#  :date  → fecha AAAA-MM-DD del elemento (noticias)
# ---------------------------------------------------------------------
details:
  members:
    parent: team
    layout: detail
    es: /grupo/equipo/:slug/
    en: /group/team/:slug/
  lines:
    parent: lines
    layout: detail
    es: /investigacion/lineas/:slug/
    en: /research/lines/:slug/
  projects:
    parent: projects
    layout: detail
    es: /investigacion/proyectos/:slug/
    en: /research/projects/:slug/
  news:
    parent: news
    layout: detail
    es: /actualidad/noticias/:date-:slug/
    en: /news/:date-:slug/

# ---------------------------------------------------------------------
#  Página de lista de cada colección. Se usa para redirigir las URL antiguas
#  (old_urls) de los elementos sin ficha propia (eventos, convocatorias,
#  noticias breves con «detail: false»).
# ---------------------------------------------------------------------
lists:
  members: team
  projects: projects
  lines: lines
  domains: domains
  news: news
  events: events
  opportunities: opportunities
