    en: /group/contact/
    title: { es: Contacto, en: Contact }
    desc: { es: Dónde estamos y cómo escribirnos, en: Where we are and how to reach us }

  # ---- Investigación ----
  - id: lines
    menu: research
    es: /investigacion/lineas/
    en: /research/lines/
    title: { es: Líneas de investigación, en: Research lines }
    desc: { es: Once líneas en cuatro ejes, en: Eleven lines in four axes }
  - id: domains
