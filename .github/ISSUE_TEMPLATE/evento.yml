# GENERADO por scripts/issue_a_contenido.py --plantillas a partir de _data/ y las
# colecciones. No lo edites a mano: cambia el script y vuelve a generarlo.
name: 📅 Nuevo evento
description: Añade un evento (taller, congreso, feria…). Pasa solo de «Próximos» a «Pasados» según la fecha.
title: '[Evento] '
labels:
- contenido
- evento
body:
- type: markdown
  attributes:
    value: Rellena el formulario y pulsa **Submit new issue**. Si tienes permiso de edición en la web, en un par de minutos aparecerá aquí un enlace a la **propuesta de cambios** con su vista previa; si no, alguien del equipo web la revisará. Si te equivocas, **edita la issue** y la propuesta se rehace.
- type: input
  id: date
  attributes:
    label: Fecha de inicio
    description: AAAA-MM-DD, p. ej. 2026-11-05 (también vale 05/11/2026)
  validations:
    required: true
- type: input
  id: end
  attributes:
    label: Fecha de fin (si dura más de un día)
    description: AAAA-MM-DD, p. ej. 2026-11-05 (también vale 05/11/2026)
- type: input
  id: title_es
  attributes:
    label: Título en español
  validations:
    required: true
- type: input
  id: title_en
  attributes:
    label: Título en inglés
- type: dropdown
  id: type
  attributes:
    label: Tipo
    options:
    - Taller
    - Congreso
    - Seminario
    - Escuela de verano
    - Reunión
    - Feria
    - Entrega de premios
    - Otro
- type: dropdown
  id: involvement
  attributes:
    label: Participación del grupo
    options:
    - Organiza
    - Presenta
    - Participa
    - Expone
    - Recibe un premio
    - Invitado
    - Asiste
- type: input
  id: place
  attributes:
    label: Lugar
    placeholder: ETSIST-UPM, Madrid
- type: dropdown
  id: format
  attributes:
    label: Formato
    options:
    - Presencial
    - En línea
    - Híbrido
- type: input
  id: website
  attributes:
    label: Página web del evento
    placeholder: https://…
- type: textarea
  id: summary_es
  attributes:
    label: Resumen en español
- type: textarea
  id: summary_en
  attributes:
    label: Resumen en inglés
- type: dropdown
  id: lang
  attributes:
    label: Idioma en que escribes el texto
    options:
    - Español
    - Inglés
  validations:
    required: true
- type: textarea
  id: texto
  attributes:
    label: Texto
    description: 'Markdown. Encabezados con «## » (no uses «# »). Puedes arrastrar imágenes aquí: se guardarán en la web.'
- type: textarea
  id: traduccion
  attributes:
    label: Traducción del texto al otro idioma (opcional)
    description: Se publica como traducción provisional, con un aviso, hasta que alguien la revise.
