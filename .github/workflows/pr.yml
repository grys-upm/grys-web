# Cada Pull Request:
# · job «build» (Comprobar PR): comprueba datos, compila, verifica y audita
#   la accesibilidad. Es el que exige la protección de la rama main.
# · job «preview» (Vista previa): compila el sitio con la ruta de la vista
#   previa, lo publica en el repositorio de vistas previas y deja el enlace en
#   un comentario de la PR. No bloquea: si falla o no está configurado, la PR
#   se puede fusionar igual. Configuración (una vez): docs/COMPILAR.md.
# · job «enlaces» (Enlaces nuevos): comprueba con lychee solo las URL que
#   añade la PR. Informativo (no lo exige la protección de main).
# · job «lighthouse» (Lighthouse): rendimiento, accesibilidad, buenas
#   prácticas y SEO de 8 páginas representativas, con el sitio de «build».
#   Informativo.
name: Comprobar PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19-10-2026
    steps:
      - uses: actions/checkout@v6

      - name: Python (para los scripts de comprobación)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Fuentes (se descargan si no están en el repositorio)
        continue-on-error: true   # si falla, la web usa las fuentes de respaldo
        run: ls assets/fonts/*.woff2 >/dev/null 2>&1 || python scripts/descargar_fuentes.py
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Métricas de citas · las últimas de main (sin consultar la API)
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: _data/metricas_pubs.yml
          key: metricas-pubs-${{ github.run_id }}
          restore-keys: metricas-pubs-
      - name: Comprobar datos
        run: python scripts/comprobar_datos.py

      - name: Informe de pendientes de los datos
        run: |
          python scripts/informe_pendientes.py
          cat reports/pendientes-datos.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: informe-pendientes
          path: reports/
      - name: Contraste AA de los tokens (ambos temas)
        run: python scripts/contraste.py
      - name: Compilar
        run: |
          set -o pipefail
          bundle exec jekyll build --config _config.yml,_config.staging.yml --trace 2>&1 | tee build.log
          if grep -E "Liquid (Warning|Exception|syntax)|Build Warning|Conflict:|GRyS:|WARN -- " build.log; then
            echo "::error::La compilación ha producido avisos (ver arriba)"; exit 1
          fi
      - name: Verificar el resultado
        run: python scripts/verificar_sitio.py _site

      # ---- Accesibilidad (fase 4). BLOQUEANTE desde el paso 4.2: cualquier
      #      incumplimiento WCAG, problema de reflow o error de JavaScript hace
      #      fallar la PR. El informe se publica siempre (también si falla).
      - name: Accesibilidad · comprobaciones estáticas
        run: |
          set +e
          python scripts/a11y_estatico.py _site --estricto; RC=$?
          cat reports/a11y/estatico.md >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - uses: actions/setup-node@v5
        if: always()
        with:
          node-version: "22"
      - name: Accesibilidad · axe-core en navegador (oscuro, claro y 320 px)
        if: always()
        run: |
          npm install --prefix scripts/a11y --no-audit --no-fund --loglevel=error
          set +e
          node scripts/a11y/auditar.mjs _site --estricto; RC=$?
          cat reports/a11y/axe.md >> "$GITHUB_STEP_SUMMARY"
          exit $RC
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: informe-accesibilidad
          path: reports/a11y/
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: sitio-compilado
          path: _site
          retention-days: 7

  preview:
    name: Vista previa
    # Solo PR del propio repositorio (las de forks y Dependabot no tienen acceso
    # a la clave) y no las de Dependabot (no cambian el contenido).
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19-10-2026
    permissions:
      contents: read
      pull-requests: write   # para el comentario con el enlace
    concurrency:
      group: vista-previa-${{ github.event.pull_request.number }}
      cancel-in-progress: true   # un push nuevo sustituye a la compilación anterior
    env:
      PREVIEW_REPO: ${{ vars.PREVIEW_REPO || 'grys-upm/grys-web-previews' }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: ¿Está configurada la vista previa?
        id: clave
        env:
          KEY: ${{ secrets.PREVIEW_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vista previa sin configurar (falta el secreto PREVIEW_DEPLOY_KEY). Ver docs/COMPILAR.md, «Vista previa de cada PR»"
          fi
      - uses: actions/checkout@v6
        if: steps.clave.outputs.ok == 'true'
      - uses: actions/setup-python@v6
        if: steps.clave.outputs.ok == 'true'
        with:
          python-version: "3.12"
      - name: Fuentes
        if: steps.clave.outputs.ok == 'true'
        continue-on-error: true
        run: ls assets/fonts/*.woff2 >/dev/null 2>&1 || python scripts/descargar_fuentes.py
      - uses: ruby/setup-ruby@v1
        if: steps.clave.outputs.ok == 'true'
        with:
          bundler-cache: true
      - name: Métricas de citas · las últimas de main
        if: steps.clave.outputs.ok == 'true'
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: _data/metricas_pubs.yml
          key: metricas-pubs-${{ github.run_id }}
          restore-keys: metricas-pubs-
      - name: Compilar la vista previa
        if: steps.clave.outputs.ok == 'true'
        id: compilar
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          OWNER="${PREVIEW_REPO%%/*}"; NOMBRE="${PREVIEW_REPO#*/}"
          printf 'preview_pr: %s\npreview_pr_url: "%s"\n' "$PR" "$PR_URL" > _config.preview.yml
          bundle exec jekyll build --config _config.yml,_config.staging.yml,_config.preview.yml --baseurl "/$NOMBRE/pr-$PR"
          echo "url=https://$OWNER.github.io/$NOMBRE/pr-$PR/" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        if: steps.clave.outputs.ok == 'true'
        with:
          repository: ${{ env.PREVIEW_REPO }}
          ssh-key: ${{ secrets.PREVIEW_DEPLOY_KEY }}
          path: previas
          fetch-depth: 1
      - name: Publicar la vista previa
        if: steps.clave.outputs.ok == 'true'
        working-directory: previas
        run: bash ../scripts/vista_previa.sh publicar "pr-$PR" ../_site
      - name: Enlace en la PR
        if: steps.clave.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.compilar.outputs.url }}
        with:
          script: |
            const marca = "<!-- grys-vista-previa -->";
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [marca,
              `🔎 **Vista previa de esta PR:** ${process.env.URL}`,
              `· English: ${process.env.URL}en/`,
              "",
              `Corresponde al commit \`${sha}\` y se actualiza con cada *push*. GitHub tarda 1–2 minutos en publicarla después de que termine este paso.`,
              "No es la web publicada ni la indexan los buscadores. Se borra al cerrar la PR."].join("\n");
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const todos = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const previo = todos.find(c => c.body && c.body.includes(marca));
            if (previo) await github.rest.issues.updateComment({ owner, repo, comment_id: previo.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
            await core.summary.addRaw(`Vista previa: ${process.env.URL}`).write();

  enlaces:
    name: Enlaces nuevos
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19-10-2026
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: URL añadidas en esta PR
        id: urls
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p reports
          git diff --unified=0 "$BASE" "$HEAD" -- . ':(exclude).github' ':(exclude)scripts' ':(exclude)*.lock' ':(exclude)lighthouserc.json' ':(exclude)lychee.toml' \
            | grep '^+' | grep -v '^+++' | sed 's/^+//' > reports/lineas-nuevas.txt || true
          grep -oE 'https?://[^ )"<>]+' reports/lineas-nuevas.txt | sort -u > reports/urls-nuevas.txt || true
          N=$(wc -l < reports/urls-nuevas.txt)
          echo "n=$N" >> "$GITHUB_OUTPUT"
          echo "URL nuevas en la PR: $N"
      - name: Caché de lychee
        if: steps.urls.outputs.n != '0'
        uses: actions/cache/restore@v5
        with:
          path: .lycheecache
          key: lychee-${{ github.run_id }}
          restore-keys: lychee-
      - name: Comprobar las URL nuevas
        if: steps.urls.outputs.n != '0'
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress reports/lineas-nuevas.txt
          format: markdown
          output: reports/enlaces.md
          fail: true
          failIfEmpty: false
          jobSummary: true
      - name: Sin URL nuevas
        if: steps.urls.outputs.n == '0'
        run: echo "Esta PR no añade enlaces externos." >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19-10-2026
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: lighthouserc.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v5
        with:
          name: sitio-compilado
          path: _site
      - name: Las páginas de lighthouserc.json existen
        run: |
          python3 - <<'PY'
          import json, os, sys
          from urllib.parse import urlsplit
          faltan = []
          for u in json.load(open("lighthouserc.json"))["ci"]["collect"]["url"]:
              p = urlsplit(u).path
              if not os.path.exists(os.path.join("_site", p.lstrip("/"), "index.html")):
                  faltan.append(p)
          if faltan:
              print("::error::lighthouserc.json apunta a páginas que no existen: " + ", ".join(faltan))
              sys.exit(1)
          PY
      - name: Lighthouse CI
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          artifactName: informe-lighthouse
          temporaryPublicStorage: false   # los informes no salen de GitHub
      - name: Resumen
        if: always() && steps.lh.outputs.manifest != ''
        env:
          MANIFEST: ${{ steps.lh.outputs.manifest }}
        run: |
          {
            echo "## Lighthouse (mediana de 3 ejecuciones, móvil simulado)"
            echo
            echo "| Página | Rendimiento | Accesibilidad | Buenas prácticas | SEO |"
            echo "|---|---|---|---|---|"
            echo "$MANIFEST" | jq -r '.[] | select(.isRepresentativeRun) | "| `\(.url | sub("^https?://[^/]+"; ""))` | \(.summary.performance*100|round) | \(.summary.accessibility*100|round) | \(.summary["best-practices"]*100|round) | \(.summary.seo*100|round) |"'
            echo
            echo "Umbrales: accesibilidad ≥ 95 y SEO ≥ 90 (error), rendimiento ≥ 80 y buenas prácticas ≥ 90 (aviso). Informes completos en el artefacto «informe-lighthouse»."
          } >> "$GITHUB_STEP_SUMMARY"
