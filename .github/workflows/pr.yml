# Compila cada Pull Request (sin publicar) y deja el sitio como artefacto
# descargable «sitio-compilado» para revisarlo. La vista previa publicada
# por PR llega en la fase 5.
name: Comprobar PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19-10-2026
    steps:
      - uses: actions/checkout@v6

      - name: Python (para los scripts de comprobación)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Fuentes (se descargan si no están en el repositorio)
        continue-on-error: true   # si falla, la web usa las fuentes de respaldo
        run: ls assets/fonts/*.woff2 >/dev/null 2>&1 || python scripts/descargar_fuentes.py
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Métricas de citas · las últimas de main (sin consultar la API)
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: _data/metricas_pubs.yml
          key: metricas-pubs-${{ github.run_id }}
          restore-keys: metricas-pubs-
      - name: Comprobar datos
        run: python scripts/comprobar_datos.py

      - name: Informe de pendientes de los datos
        run: |
          python scripts/informe_pendientes.py
          cat reports/pendientes-datos.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: informe-pendientes
          path: reports/
      - name: Contraste AA de los tokens (ambos temas)
        run: python scripts/contraste.py
      - name: Compilar
        run: |
          set -o pipefail
          bundle exec jekyll build --config _config.yml,_config.staging.yml --trace 2>&1 | tee build.log
          if grep -E "Liquid (Warning|Exception|syntax)|Build Warning|Conflict:|GRyS:|WARN -- " build.log; then
            echo "::error::La compilación ha producido avisos (ver arriba)"; exit 1
          fi
      - name: Verificar el resultado
        run: python scripts/verificar_sitio.py _site

      # ---- Accesibilidad (fase 4). De momento solo INFORMA: no bloquea la PR.
      #      Cuando esté todo corregido, se añadirá --estricto a los dos scripts.
      - name: Accesibilidad · comprobaciones estáticas
        run: |
          python scripts/a11y_estatico.py _site
          cat reports/a11y/estatico.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Accesibilidad · axe-core en navegador (oscuro, claro y 320 px)
        continue-on-error: true   # un fallo de la herramienta no debe bloquear la PR
        run: |
          npm install --prefix scripts/a11y --no-audit --no-fund --loglevel=error
          node scripts/a11y/auditar.mjs _site
          cat reports/a11y/axe.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: informe-accesibilidad
          path: reports/a11y/
          retention-days: 14
      - uses: actions/upload-artifact@v6
        with:
          name: sitio-compilado
          path: _site
          retention-days: 7
