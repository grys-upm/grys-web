# Compila el sitio y lo publica en GitHub Pages.
# · Cada push a main, a mano (Run workflow) y todos los días a las 05:15 UTC
#   (para que eventos y convocatorias se reclasifiquen según la fecha).
# · En el repositorio de pruebas añade _config.staging.yml (noindex) y usa
#   como baseurl la ruta que da GitHub Pages (/nombre-del-repo).
# · Métricas de citas (Dimensions): se piden ANTES de compilar si los datos
#   tienen más de METRICAS_MAX_EDAD días, o ya mismo con «Run workflow» →
#   «Actualizar ya las métricas». Se guardan en la caché de Actions (no en el
#   repositorio); si la API falla, se publican las últimas cifras conocidas.
# Requisito: Settings → Pages → Source: «GitHub Actions».
name: Compilar y publicar

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      actualizar_metricas:
        description: "Actualizar ya las métricas de citas (Dimensions)"
        type: boolean
        default: false
  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  METRICAS_MAX_EDAD: 7   # días; 1 = se actualizan en cada compilación diaria

jobs:
  build:
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19-10-2026
    steps:
      - uses: actions/checkout@v6

      - name: Python (para los scripts de comprobación)
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: Fuentes (se descargan si no están en el repositorio)
        continue-on-error: true   # si falla, la web usa las fuentes de respaldo
        run: ls assets/fonts/*.woff2 >/dev/null 2>&1 || python scripts/descargar_fuentes.py

      - name: Ruby y gemas
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true   # lee .ruby-version; genera Gemfile.lock si falta

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Métricas de citas · recuperar las últimas
        uses: actions/cache/restore@v5
        with:
          path: _data/metricas_pubs.yml
          key: metricas-pubs-${{ github.run_id }}
          restore-keys: metricas-pubs-
      - name: Métricas de citas · actualizar si toca (Dimensions)
        continue-on-error: true   # nunca impide publicar
        run: |
          FORZAR=""
          if [ "${{ inputs.actualizar_metricas }}" = "true" ]; then FORZAR="--forzar"; fi
          python scripts/metricas_dimensions.py --max-edad "$METRICAS_MAX_EDAD" $FORZAR | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Métricas de citas · guardar
        uses: actions/cache/save@v5
        continue-on-error: true
        with:
          path: _data/metricas_pubs.yml
          key: metricas-pubs-${{ github.run_id }}

      - name: Comprobar datos
        run: python scripts/comprobar_datos.py

      - name: Informe de pendientes de los datos
        run: |
          python scripts/informe_pendientes.py
          cat reports/pendientes-datos.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: informe-pendientes
          path: reports/
      - name: Contraste AA de los tokens (ambos temas)
        run: python scripts/contraste.py

      - name: Compilar
        env:
          JEKYLL_ENV: production
        run: |
          set -o pipefail
          CONFIG="_config.yml"
          if [ "${GITHUB_REPOSITORY}" != "grys-upm/grys-upm.github.io" ]; then
            CONFIG="_config.yml,_config.staging.yml"
          fi
          bundle exec jekyll build --config "$CONFIG" --baseurl "${{ steps.pages.outputs.base_path }}" --trace 2>&1 | tee build.log
          # Criterio de aceptación: ni errores ni avisos
          if grep -E "Liquid (Warning|Exception|syntax)|Build Warning|Conflict:|GRyS:|WARN -- " build.log; then
            echo "::error::La compilación ha producido avisos (ver arriba)"; exit 1
          fi

      - name: Verificar el resultado
        run: python scripts/verificar_sitio.py _site --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Guardar Gemfile.lock (para añadirlo al repositorio si no existe)
        if: hashFiles('Gemfile.lock') != ''
        uses: actions/upload-artifact@v6
        with:
          name: Gemfile.lock
          path: Gemfile.lock

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04   # fijo: ubuntu-latest pasa a Ubuntu 26 desde el 19-10-2026
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
